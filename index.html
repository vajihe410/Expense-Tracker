<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Application Header -->
        <header class="app-header">
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses easily</p>
        </header>


        <!-- Balance Summary -->
        <section class="balance-card">
            <h2>Total Balance</h2>
            <p id="balance">$0.00</p>
        </section>


        <!-- Income and Expense Cards -->
        <section class="summary-grid">

            <article class="summary-card income-card">
                <h3>Total Income</h3>
                <p id="income">$0.00</p>
            </article>

            <article class="summary-card expense-card">
                <h3>Total Expenses</h3>
                <p id="expenses">$0.00</p>
            </article>

        </section>


        <!-- Transaction Form -->
        <section class="form-section">

            <h2>Add Transaction</h2>

            <form id="transaction-form">

                <div class="form-group">
                    <label for="title">
                        Title / Description
                    </label>

                    <input 
                        type="text" 
                        id="title" 
                        placeholder="Example: Salary, Shopping..."
                    >

                    <small class="error" id="title-error"></small>
                </div>


                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input 
                        type="number" 
                        id="amount"
                        placeholder="Enter amount"
                        step="0.01"
                    >

                    <small class="error" id="amount-error"></small>

                </div>


                <div class="form-group">

                    <label for="type">
                        Transaction Type
                    </label>

                    <select id="type">

                        <option value="">
                            Select type
                        </option>

                        <option value="income">
                            Income
                        </option>

                        <option value="expense">
                            Expense
                        </option>

                    </select>

                    <small class="error" id="type-error"></small>

                </div>


                <button type="submit">
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- Transaction History -->
        <section class="history-section">

            <h2>Transaction History</h2>

            <ul id="transaction-list">
                <!-- Transactions will be added dynamically -->
            </ul>

        </section>


    </main>


    <script src="script.js"></script>

</body>
</html>
